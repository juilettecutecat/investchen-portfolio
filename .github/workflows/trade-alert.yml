name: IC Trade Alert

on:
  push:
    paths:
      - 'trade_log.jsonl'

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Parse new trades
        id: trades
        run: |
          # Extract lines added in this commit (actual trades only, skip SESSION_UPDATE)
          TRADE_LINES=$(git diff HEAD~1 HEAD -- trade_log.jsonl | grep '^\+{' | sed 's/^\+//' | python3 -c "
import sys, json
lines = []
for line in sys.stdin:
    line = line.strip()
    try:
        obj = json.loads(line)
        if obj.get('action') not in ('SESSION_UPDATE',):
            lines.append(obj)
    except:
        pass

if not lines:
    print('NO_TRADES')
else:
    summary = []
    for t in lines:
        action = t.get('action','?')
        ticker = t.get('ticker','?')
        amount = t.get('amount_gbp', '')
        price = t.get('price_usd', '')
        tier = t.get('tier','')
        if action == 'STOP_TRAIL':
            old = t.get('old_stop_usd','')
            new = t.get('new_stop_usd','')
            summary.append(f'{ticker} {action}: stop {old}->{new}')
        elif amount:
            summary.append(f'{ticker} {action} {tier} £{amount} @ ${price}')
        else:
            summary.append(f'{ticker} {action}')
    print('|'.join(summary))
")
          echo "trades=$TRADE_LINES" >> $GITHUB_OUTPUT

      - name: Get portfolio stats
        id: stats
        if: steps.trades.outputs.trades != 'NO_TRADES'
        run: |
          TOTAL=$(python3 -c "import json; p=json.load(open('portfolio.json')); print(f"{p['total_value_gbp']:.2f}")" 2>/dev/null || echo '?')
          CUM=$(python3 -c "import json; p=json.load(open('portfolio.json')); c=p.get('cumulative_return_pct',0); print(f'+{c:.2f}' if c>=0 else f'{c:.2f}')" 2>/dev/null || echo '?')
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "cum=$CUM" >> $GITHUB_OUTPUT

      - name: Send trade alert email
        if: steps.trades.outputs.trades != 'NO_TRADES'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TRADES: ${{ steps.trades.outputs.trades }}
          TOTAL: ${{ steps.stats.outputs.total }}
          CUM: ${{ steps.stats.outputs.cum }}
        run: |
          python3 << 'PYEOF'
          import json, subprocess, os

          trades_raw = os.environ.get('TRADES', '')
          total = os.environ.get('TOTAL', '?')
          cum = os.environ.get('CUM', '?')

          trades_list = trades_raw.split('|') if trades_raw else []
          trades_text = '
'.join(f'  • {t}' for t in trades_list)

          subject = f"IC 交易提醒 | £{total} ({cum}%累计)"
          body = f"""InvestChen (IC) 今日有操作

{trades_text}

当前组合: £{total}
累计收益: {cum}%

--- InvestChen IC | 模拟盘，非投资建议 ---"""

          payload = json.dumps({
              "from": "InvestChen IC <onboarding@resend.dev>",
              "to": ["cyjei2023@gmail.com"],
              "subject": subject,
              "text": body
          })

          result = subprocess.run([
              "curl", "-s", "-X", "POST", "https://api.resend.com/emails",
              "-H", f"Authorization: Bearer {os.environ['RESEND_API_KEY']}",
              "-H", "Content-Type: application/json",
              "-d", payload
          ], capture_output=True, text=True)

          print(result.stdout)
          if '"id"' in result.stdout:
              print(f'✅ 交易提醒已发送: {subject}')
          else:
              raise SystemExit(f'❌ 发送失败: {result.stdout}')
          PYEOF
